# Project: Your AI Engine Room
#    Repo: Octobot-Docker
#    File: Docker-octobot/docker-compose.yml
# Version: 1.0.85
# Changed: 2026-08-28

services:
  paperclip01:
    read_only: ${BOT_INSTALL_RO:-true}
    image: "${DOCKER_IMAGE:-youritdepartment/youraiengineroom:latest}"
    pull_policy: missing
    container_name: ${PAPERCLIP_HOST}
    hostname: ${PAPERCLIP_HOST}
    restart: unless-stopped
    # Does not work on a Apple Mac Docer Setup
    security_opt:
      - apparmor=octobot-sandbox
      # - seccomp=unconfined
      # - seccomp=./security/seccomp/seccomp-octobot-userns.json
      - seccomp=/etc/security/seccomp-octobot-userns.json
      - systempaths=unconfined
    depends_on:
      postgres01:
        condition: service_healthy
    ports:
      - "${BOT_SSH_PORT}:22"
    networks:
      backend-network:
        aliases:
          - paperclip01
    labels:
      - traefik.enable=true
      # Paperclip
      - traefik.http.services.paperclip${ID}-${COMPOSE_PROJECT_NAME}-LB.loadbalancer.server.port=${PAPERCLIP_PORT:-3100}
      - traefik.http.routers.paperclip${ID}-${COMPOSE_PROJECT_NAME}-R.rule=Host(`${PAPERCLIP_FQDN}`)
      - traefik.http.routers.paperclip${ID}-${COMPOSE_PROJECT_NAME}-R.service=paperclip${ID}-${COMPOSE_PROJECT_NAME}-LB
      - traefik.http.routers.paperclip${ID}-${COMPOSE_PROJECT_NAME}-R.entrypoints=websecure
      - traefik.http.routers.paperclip${ID}-${COMPOSE_PROJECT_NAME}-R.tls.certresolver=letsencrypt
      - traefik.http.routers.paperclip${ID}-${COMPOSE_PROJECT_NAME}-R.middlewares=${FOWARDAUTH_MW}
      # # Web Dashboard / Web Page - Port 8090
      # - traefik.http.services.web${ID}-${COMPOSE_PROJECT_NAME}-LB.loadbalancer.server.port=${WEB_PORT:-8090}
      # - traefik.http.routers.web${ID}-${COMPOSE_PROJECT_NAME}-R.rule=Host(`web.${PAPERCLIP_FQDN}`)
      # - traefik.http.routers.web${ID}-${COMPOSE_PROJECT_NAME}-R.service=web${ID}-${COMPOSE_PROJECT_NAME}-LB
      # - traefik.http.routers.web${ID}-${COMPOSE_PROJECT_NAME}-R.entrypoints=websecure
      # - traefik.http.routers.web${ID}-${COMPOSE_PROJECT_NAME}-R.tls.certresolver=letsencrypt
      # - traefik.http.routers.web${ID}-${COMPOSE_PROJECT_NAME}-R.middlewares=${FOWARDAUTH_MW}
      # # Hermes
      # - traefik.http.services.hermes${ID}-${COMPOSE_PROJECT_NAME}-LB.loadbalancer.server.port=${HERMES_PORT_WEB:-9119}
      # - traefik.http.routers.hermes${ID}-${COMPOSE_PROJECT_NAME}-R.rule=Host(`hermes.${PAPERCLIP_FQDN}`)
      # - traefik.http.routers.hermes${ID}-${COMPOSE_PROJECT_NAME}-R.service=hermes${ID}-${COMPOSE_PROJECT_NAME}-LB
      # - traefik.http.routers.hermes${ID}-${COMPOSE_PROJECT_NAME}-R.entrypoints=websecure
      # - traefik.http.routers.hermes${ID}-${COMPOSE_PROJECT_NAME}-R.tls.certresolver=letsencrypt
      # - traefik.http.routers.hermes${ID}-${COMPOSE_PROJECT_NAME}-R.middlewares=${FOWARDAUTH_MW}
      # # Open Claw
      # - traefik.http.services.claw${ID}-${COMPOSE_PROJECT_NAME}-LB.loadbalancer.server.port=${OPENCLAW_PORT:-18789}
      # - traefik.http.routers.claw${ID}-${COMPOSE_PROJECT_NAME}-R.rule=Host(`claw.${PAPERCLIP_FQDN}`)
      # - traefik.http.routers.claw${ID}-${COMPOSE_PROJECT_NAME}-R.service=claw${ID}-${COMPOSE_PROJECT_NAME}-LB
      # - traefik.http.routers.claw${ID}-${COMPOSE_PROJECT_NAME}-R.entrypoints=websecure
      # - traefik.http.routers.claw${ID}-${COMPOSE_PROJECT_NAME}-R.tls.certresolver=letsencrypt
      # - traefik.http.routers.claw${ID}-${COMPOSE_PROJECT_NAME}-R.middlewares=${FOWARDAUTH_MW}
      #---------------------------------------------------------------------------------------------------------------
      # Callback - Temporary for testing - will be removed in future versions
      - traefik.http.services.callback${ID}-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8070
      - traefik.http.routers.callback${ID}-${COMPOSE_PROJECT_NAME}.rule=Host(`callback${ID}.${VPS}.${DOMAIN}`)
      - traefik.http.routers.callback${ID}-${COMPOSE_PROJECT_NAME}.service=callback${ID}-${COMPOSE_PROJECT_NAME}
      - traefik.http.routers.callback${ID}-${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.callback${ID}-${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.routers.callback${ID}-${COMPOSE_PROJECT_NAME}-http.rule=Host(`callback${ID}.${VPS}.${DOMAIN}`)
      - traefik.http.routers.callback${ID}-${COMPOSE_PROJECT_NAME}-http.entrypoints=web
      - traefik.http.routers.callback${ID}-${COMPOSE_PROJECT_NAME}-http.service=callback${ID}-${COMPOSE_PROJECT_NAME}
      - traefik.http.routers.callback${ID}-${COMPOSE_PROJECT_NAME}-http.middlewares=callback${ID}-${COMPOSE_PROJECT_NAME}-redirect
      - traefik.http.middlewares.callback${ID}-${COMPOSE_PROJECT_NAME}-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.callback${ID}-${COMPOSE_PROJECT_NAME}-redirect.redirectscheme.permanent=true
    environment:
      IMAGE: ${DOCKER_IMAGE:-youritdepartment/youraiengineroom:latest}
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME}"
      COMPOSE_SERVICE: "paperclip01"
      CONTAINER_NAME: "${PAPERCLIP_HOST}"
      HOST_NAME: "${PAPERCLIP_HOST}"
      VPS: "${VPS}"
      PRE: "${PRE}"
      ID: "${ID}"
      GROUP: "${GROUP}"
      APP_NAME: "${APP_NAME}"
      APP_SERVER: "${APP_SERVER}"
      APP_CODE: "${APP_CODE:-${PRE}}"
      APP_ID: "${APP_ID}"
      APP_DATE: "${APP_DATE}"
      APP_OWNER: "${APP_OWNER}"
      DOMAIN: "${DOMAIN}"
      DOCKER_IMAGE: "${DOCKER_IMAGE}"
      DOCKER_NETWORK: "${DOCKER_NETWORK}"
      DOCKER_V_SHARED: "${DOCKER_V_SHARED}"
      DOCKER_V_SYSOPS: "${DOCKER_V_SYSOPS}"
      DOCKER_V_INSTALL: "${DOCKER_V_INSTALL}"
      DOCKER_V_CONTROL: "${DOCKER_V_CONTROL}"
      DOCKER_V_PROJECTS: "${DOCKER_V_PROJECTS}"
      DOCKER_V_HOME: "${DOCKER_V_HOME}"
      DOCKER_V_TMP: "${DOCKER_V_TMP}"
      DOCKER_V_LOGS: "${DOCKER_V_LOGS}"
      FOWARDAUTH_MW: "${FOWARDAUTH_MW}"
      BOT_VHOME: "${BOT_VHOME:-/vhome}"
      BOT_VER: "${BOT_VER:-v00}"
      BOT_ROLE: "${BOT_ROLE:-m}"
      BOT_INSTALL: "${BOT_INSTALL:-/install}"
      BOT_INSTALL_RO: "${BOT_INSTALL_RO:-true}"
      BOT_INSTALL_PAPERCLIP: "${BOT_INSTALL_PAPERCLIP:-true}"
      BOT_SYSOPS: "${BOT_SYSOPS:-/sysops}"
      BOT_SHARED: "${BOT_SHARED:-/shared}"
      BOT_CONTROL: "${BOT_CONTROL:-/control}"
      BOT_PROJECTS: "${BOT_PROJECTS:-/Projects}"
      BOT_LOGIN: "${BOT_LOGIN:-octobot}"
      BOT_PASSWORD: "${BOT_PASSWORD:-NeedToSetThePassword}"
      BOT_SSH_KEY: "${BOT_SSH_KEY}"
      BOT_UID: "${BOT_UID:-1502}"
      BOT_SSH_PORT: "${BOT_SSH_PORT}"
      # supervisord services to match contig file
      BOT_SSH_ENABLED: ${BOT_SSH_ENABLED:-false}
      BOT_PAPERCLIP_ENABLED: ${BOT_PAPERCLIP_ENABLED:-false}
      BOT_OPENCLAW_ENABLED: ${BOT_OPENCLAW_ENABLED:-false}
      BOT_BUSINESS_BRAIN_ENABLED: ${BOT_BUSINESS_BRAIN_ENABLED:-false}
      BOT_HERMES_DASHBOARD_ENABLED: ${BOT_HERMES_DASHBOARD_ENABLED:-false}
      BOT_OBSIDIAN_ENABLED: ${BOT_OBSIDIAN_ENABLED:-false}
      BOT_CLAUDE_REMOTE_ENABLED: ${BOT_CLAUDE_REMOTE_ENABLED:-false}
      #--------------------------------------------------------------------
      SERVICE_LOGIN: "${SERVICE_LOGIN:-service}"
      SERVICE_SSH_KEY: "${SERVICE_SSH_KEY}"
      SERVICE_UID: "${SERVICE_UID:-1501}"
      SERVICE_PASSWORD: "${SERVICE_PASSWORD:-NeedToSetThePassword}"
      BREW_HOME: "${BREW_HOME:-/home/linuxbrew/.linuxbrew}"
      PAPERCLIP_HOME: "${PAPERCLIP_HOME:-/shared/paperclip-home}"
      PAPERCLIP_CONFIG: "${PAPERCLIP_CONFIG:-}"
      PAPERCLIP_BIN: "${PAPERCLIP_BIN:-}"
      PAPERCLIP_CLI: "${PAPERCLIP_CLI:-}"
      PAPERCLIP_FQDN: "${PAPERCLIP_FQDN:-}"
      PAPERCLIP_PORT: "${PAPERCLIP_PORT:-3100}"
      PAPERCLIP_HOST: "${PAPERCLIP_HOST:-}"
      PAPERCLIP_TELEMETRY_DISABLED: "${PAPERCLIP_TELEMETRY_DISABLED:-1}"
      PAPERCLIP_MIGRATION_AUTO_APPLY: "${PAPERCLIP_MIGRATION_AUTO_APPLY:-true}"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-}"
      PAPERCLIP_RUNTIME_API_URL: "${PAPERCLIP_RUNTIME_API_URL:-}"
      PAPERCLIP_API_URL: "${PAPERCLIP_API_URL:-}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES}"
      PAPERCLIP_RELEASE_DIR: "${PAPERCLIP_RELEASE_DIR:-/install/paperclip-release}"
      PAPERCLIP_YID_BRANCH: "${PAPERCLIP_YID_BRANCH:-PRODUCTION}"
      PAPERCLIP_YID_REPO: "${PAPERCLIP_YID_REPO:-https://github.com/YourITDept/paperclip.git}"
      PAPERCLIP_YID_ONBOARD: ${PAPERCLIP_YID_ONBOARD:-false}
      PAPERCLIP_CODEX_HOME: "${PAPERCLIP_CODEX_HOME:-}"
      PAPERCLIP_NO_BROWSER: "${PAPERCLIP_NO_BROWSER:-1}"
      POSTGRES_USER: "${POSTGRES_USER:-}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_DB: "${POSTGRES_DB:-}"
      POSTGRES_PORT: "${POSTGRES_PORT:-}"
      POSTGRES_HOST: "${POSTGRES_HOST:-}"
      POSTGRES_URL: "${POSTGRES_URL:-}"
      POSTGRES_M_USER: "${POSTGRES_M_USER:-}"
      POSTGRES_M_PASSWORD: "${POSTGRES_M_PASSWORD:-}"
      POSTGRES_M_DB: "${POSTGRES_M_DB:-}"
      POSTGRES_M_PORT: "${POSTGRES_M_PORT:-}"
      POSTGRES_M_HOST: "${POSTGRES_M_HOST:-}"
      POSTGRES_M_URL: "${POSTGRES_M_URL:-}"
      OBSIDIAN_EMAIL: "${OBSIDIAN_EMAIL:-}"
      OBSIDIAN_VAULT: "${OBSIDIAN_VAULT:-}"
      OBSIDIAN_PASSWORD: "${OBSIDIAN_PASSWORD}"
      OBSIDIAN_SYNCPASSWORD: "${OBSIDIAN_SYNCPASSWORD}"
      BUSINESS_BRAIN_DIR: "${BUSINESS_BRAIN_DIR:-/shared/business-brain}"
      HOSTINGER_EMAIL_API_KEY: "${HOSTINGER_EMAIL_API_KEY:-}"
      OPENCLAW_PORT: ${OPENCLAW_PORT:-18789}
      WEB_PORT: ${WEB_PORT:-8090}
      HERMES_PORT_WEB: ${HERMES_PORT_WEB:-9119}
      HERMES_PORT_API: ${HERMES_PORT_API:-8642}
      HERMES_UID: "${HERMES_UID:-10010}"
      HERMES_IMAGE: "${HERMES_IMAGE:-}"
      HERMES_FQDN: "${HERMES_FQDN:-}"
      HERMES_LOGIN: "${HERMES_LOGIN:-hermes}"
      HERMES_HOME: "${HERMES_HOME:-/home/hermes}"
      HERMES_PASSWORD: "${HERMES_PASSWORD:-NeedToSetThePassword}"
      DASHBOARD_HOST: "${DASHBOARD_HOST:-}"
      WORKSPACE_HOST: "${WORKSPACE_HOST:-}"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-hermes}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-NeedToSetThePassword}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-NeedToSetTheSecret}"
      API_SERVER_KEY: "${API_SERVER_KEY:-NeedToSetTheKey}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_DEFAULT_MODEL: "${ANTHROPIC_DEFAULT_MODEL:-}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MANAGEMENT_KEY: "${OPENROUTER_MANAGEMENT_KEY:-}"
      OPENROUTER_WORKSPACE_ID: "${OPENROUTER_WORKSPACE_ID:-}"
      OPENROUTER_KEY_LIMIT: "${OPENROUTER_KEY_LIMIT:-20}"
      OPENROUTER_KEY_NAME: "${OPENROUTER_KEY_NAME:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
    tmpfs:
      - /run
    volumes:
      - paperclip01-projects:/Projects
      - type: volume
        source: paperclip01-install
        target: ${BOT_INSTALL:-/install}
        read_only: ${BOT_INSTALL_RO:-true}
      - paperclip01-control:${BOT_CONTROL:-/control}
      - paperclip01-shared:${BOT_SHARED:-/shared}
      - paperclip01-vhome:${BOT_VHOME:-/vhome}
      - paperclip01-sysops:${BOT_SYSOPS:-/sysops}
      - paperclip01-logs:/var/log
      - paperclip01-tmp:/tmp

  postgres01:
    image: "${POSTGRES_DOCKER_IMAGE:-postgres:17-alpine}"
    container_name: ${POSTGRES_DOCKER_HOST}
    hostname: ${POSTGRES_DOCKER_HOST}
    restart: unless-stopped
    networks:
      backend-network:
        aliases:
          - postgres01
    environment:
      IMAGE: "${POSTGRES_DOCKER_IMAGE:-postgres:17-alpine}"
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME}"
      COMPOSE_SERVICE: "postgres01"
      CONTAINER_NAME: "${POSTGRES_DOCKER_HOST}"
      HOST_NAME: "${POSTGRES_DOCKER_HOST}"
      VPS: "${VPS}"
      PRE: "${PRE}"
      ID: "${ID}"
      GROUP: "${GROUP}"
      APP_NAME: "${APP_NAME}"
      APP_SERVER: "${APP_SERVER}"
      APP_CODE: "${APP_CODE:-${PRE}}"
      APP_ID: "${APP_ID}"
      APP_DATE: "${APP_DATE}"
      APP_OWNER: "${APP_OWNER}"
      DOMAIN: "${DOMAIN}"
      DOCKER_IMAGE: "${POSTGRES_DOCKER_IMAGE}"
      DOCKER_NETWORK: "${DOCKER_NETWORK}"
      DOCKER_V_POSTGRES: "${DOCKER_V_POSTGRES}"
      POSTGRES_DOCKER_IMAGE: "${POSTGRES_DOCKER_IMAGE}"
      POSTGRES_DOCKER_HOST: "${POSTGRES_DOCKER_HOST}"
      POSTGRES_USER: "${POSTGRES_M_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_M_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_M_DB}"
      POSTGRES_PORT: "${POSTGRES_M_PORT}"
      POSTGRES_HOST: "${POSTGRES_M_HOST}"
      POSTGRES_URL: "${POSTGRES_M_URL}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_M_USER} -d ${POSTGRES_M_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres01-data:/var/lib/postgresql/data

volumes:
  paperclip01-projects:
    name: ${DOCKER_V_PROJECTS}
  paperclip01-control:
    name: ${DOCKER_V_CONTROL}
  paperclip01-install:
    name: ${DOCKER_V_INSTALL}
  paperclip01-shared:
    name: ${DOCKER_V_SHARED}
  paperclip01-vhome:
    name: ${DOCKER_V_HOME}
  paperclip01-sysops:
    name: ${DOCKER_V_SYSOPS}
  paperclip01-tmp:
    name: ${DOCKER_V_TMP}
  paperclip01-logs:
    name: ${DOCKER_V_LOGS}
  postgres01-data:
    name: ${DOCKER_V_POSTGRES}

networks:
  backend-network:
    name: ${DOCKER_NETWORK}
